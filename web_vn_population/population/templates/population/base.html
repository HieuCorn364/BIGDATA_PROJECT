<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dữ liệu Dân số Việt Nam{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .content {
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
        .btn-custom {
            margin: 10px 0;
        }
        footer {
            background-color: #343a40;
            color: white;
            padding: 15px 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'population_list' %}">Dữ liệu Dân số VN</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'population_list' %}">Danh sách dân số</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'region_stats' %}?calculate=region_stats">Tỷ trọng theo vùng</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'area_population_ratio' %}?calculate=area_stats">Tỷ trọng theo khu vực</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'hdfs_browser' %}">HDFS Browser</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="container content">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center">
        <div class="container">
            <p>&copy; 2025 Dữ liệu Dân số Việt Nam. Powered by xAI.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
